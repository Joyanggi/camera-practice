<head>

<title>camera-practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap">
<style>
:root{--paper:#F1F2EF;--ink:#15191A;--ink-2:#4B5255;--mark:#D14430;--rule:#D6D9D4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15191A;--ink:#EDEEEA;--ink-2:#B4B9B3;--mark:#E8684F;--rule:#2C3234}}
:root[data-theme="dark"]{--paper:#15191A;--ink:#EDEEEA;--ink-2:#B4B9B3;--mark:#E8684F;--rule:#2C3234}
html,body{margin:0}body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;padding:48px 16px 64px}
main{max-width:640px;margin:0 auto}h1{font-family:"Gowun Batang",serif;font-size:32px;margin:0 0 8px}
p{color:var(--ink-2);line-height:1.7;font-size:15px}
a.card{display:block;padding:20px 0;border-top:1px solid var(--rule);text-decoration:none;color:inherit}
a.card:last-of-type{border-bottom:1px solid var(--rule)}a.card h2{font-family:"Gowun Batang",serif;font-size:21px;margin:0 0 6px}
a.card span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mark);font-family:ui-monospace,monospace}
a.card p{margin:6px 0 0}
</style>
</head>
<body>
<main>
<h1>camera-practice</h1>
<p>리코 GR IV, 28mm 단일 화각으로 빛·거리·구도를 익히는 수련표 두 벌. 체크 표시는 이 브라우저에만 저장된다.</p>
<a class="card" href="compact.html"><span>압축판</span><h2>28mm 여덟 주</h2><p>한 주에 개념 하나·과제 하나. 필수 영상 11편, 책 한 권, 카메라 규칙 한 줄. 여기서 시작한다.</p></a>
<a class="card" href="training.html"><span>원본</span><h2>28mm 수련표</h2><p>영상 31편 자막 전수 검증, GR IV 유저 모드 세팅, 현장 카드, 덜어내기 세 도구, 대표 사진 링크. 자료실과 매뉴얼로 쓴다.</p></a>
</main>
